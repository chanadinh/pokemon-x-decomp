name: Bug report
description: Report a reproducible problem in the tracked code or documentation.
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the command, commit, operating system, and tool versions. Do not attach game files or secrets.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or synthetic fixture
      description: Share a minimal example and relevant error output.
