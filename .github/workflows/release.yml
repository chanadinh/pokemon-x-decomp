name: Draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up MSYS2 and SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            zip

      - name: Build Windows viewers
        shell: msys2 {0}
        run: |
          make -C native all
          mkdir -p release-assets/PokemonX-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows/bin
          for executable in pokemon_asset_viewer pokemon_model_viewer pokemon_field_viewer pokemon_slice pica_probe shader_check; do
            cp "native/build/$executable.exe" "release-assets/PokemonX-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows/bin/$executable.exe"
          done
          cp /mingw64/bin/SDL2.dll "release-assets/PokemonX-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows/bin/SDL2.dll"
          cat > "release-assets/PokemonX-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows/README.txt" <<'EOF'
          Pokémon X native viewer demo for Windows

          Run the self-contained synthetic demo:
            bin\pokemon_asset_viewer.exe --demo
            bin\pokemon_model_viewer.exe --demo
            bin\pokemon_field_viewer.exe --demo
            bin\pokemon_slice.exe --demo

          Real-data viewing requires a locally extracted RomFS passed with
          --romfs. This release does not include Nintendo game files.
          EOF
          cd release-assets
          zip -r "PokemonX-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows.zip" "PokemonX-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-windows"

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-asset
          path: release-assets/*.zip

  release:
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reconstructed C tests
        run: make -C reconstructed test

      - name: Run analysis tool tests
        run: python3 -m unittest discover -s tests -v

      - name: Run native decoder tests
        run: make -C native test

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build and smoke-test native viewer
        run: |
          make -C native all
          make -C native test-runtime
          SDL_VIDEODRIVER=dummy native/build/pokemon_asset_viewer \
            --demo --software --frames 3 --self-test-input \
            --screenshot native/build/demo.bmp

      - name: Package native Linux executables
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/package_native_release.sh "$RELEASE_TAG" release-assets

      - name: Package source archives
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/package_release.sh "$RELEASE_TAG" release-assets

      - name: Download Windows release asset
        uses: actions/download-artifact@v4
        with:
          name: windows-release-asset
          path: release-assets

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft \
            --verify-tag \
            --title "Pokémon X decompilation $RELEASE_TAG" \
            --notes "$(cat <<'EOF'
          ## What's included

          This milestone packages the verified portable-C reconstruction and native
          asset viewer source at the tagged commit.

          - Reconstructed C module sources and synthetic tests
          - Native GARC, LZ, BCLIM, ETC1, BCH, CGFX, and field-scene tooling
          - Linux native viewer executables with self-contained demo modes
          - Windows native viewer executables with self-contained demo modes
          - Reproducible ZIP and TAR.GZ source archives
          - SHA-256 checksums for both source archives

          ## Validation

          The release workflow runs the reconstructed C tests, Python analysis
          tests, native decoder tests, and the SDL native-viewer smoke test before
          creating this draft.

          ## Scope

          This is an early research milestone, not a playable PC port. It does
          not contain Nintendo game files or other copyrighted game assets. The
          Linux executable bundle runs the synthetic demo; real-data viewing
          requires a locally extracted RomFS.
          EOF
          )"
